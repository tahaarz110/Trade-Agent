name: trade-agent

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: trade_agent
      POSTGRES_PASSWORD: trade_agent
      POSTGRES_DB: trade_agent
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trade_agent -d trade_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../../apps/api/.env
    environment:
      DATABASE_URL: postgresql+psycopg://trade_agent:trade_agent@db:5432/trade_agent
      ATTACHMENT_DIR: /storage/attachments
      BACKUP_DIR: /storage/backups
      PARQUET_DIR: /storage/analytics/parquet
    ports:
      - "8000:8000"
    volumes:
      - ../../apps/api:/app
      - ../../storage:/storage
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  db_data:
